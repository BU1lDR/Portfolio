name: Deploy to GitHub Pages

# Every push to main publishes the site.
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # ── the one thing that cannot be static in a static site ────────────────
      # Pages answers any missing path with 404.html and leaves the URL alone, so
      # every relative href in that file resolves against the path that was ASKED
      # FOR rather than the site root. It pins a <base> to fix that, and the long
      # comment at the top of the file explains why the base has to be markup the
      # preload scanner can see rather than something a script writes.
      #
      # Which leaves it hardcoding /Portfolio/ — true only while the repo is named
      # Portfolio. Rename it, or move to a custom domain, and a stranger's 404 is
      # the one page on the site that loses its stylesheet. Pages knows its own
      # root, so ask, and write the answer in on the way past.
      - name: Point the 404 page at the published root
        run: |
          root='${{ steps.pages.outputs.base_path }}'
          # base_path is authoritative. The fallback is GitHub's own rule, in case
          # the action stops emitting it: a repo named <owner>.github.io publishes
          # at /, so does any repo with a CNAME, and everything else at /<repo>/.
          if [ -z "$root" ]; then
            repo='${{ github.repository }}'; repo="${repo#*/}"
            owner=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')
            if [ -f CNAME ] || [ "$(echo "$repo" | tr 'A-Z' 'a-z')" = "$owner.github.io" ]
            then root='/'
            else root="/$repo"
            fi
          fi
          [ "$root" = '/' ] || root="${root%/}/"
          # Fail loudly rather than ship a 404 page that cannot find its CSS. A
          # broken deploy is visible; an unstyled error page is found by a
          # stranger, months later, and never reported.
          case "$root" in
            /*) ;;
            *) echo "::error::computed root '$root' is not absolute"; exit 1 ;;
          esac
          sed -i "s|<base href=\"[^\"]*\">|<base href=\"$root\">|" 404.html
          grep -q "<base href=\"$root\">" 404.html || {
            echo "::error::the <base> substitution did not take"; exit 1; }
          echo "404.html base -> $root"

      # Runs after the <base> rewrite, not before, so it checks the bytes that
      # actually ship. The policy lives in a <meta> tag because Pages cannot set
      # headers, which means it sits in the same file as the things it restricts
      # and drifts out of step with them silently — a stale sha256 does not warn,
      # it just stops the script running. 404.html pins two inline blocks that
      # way, and one of them is what gives a stranger's 404 its stylesheet.
      #
      # Same reasoning as the substitution check above: a broken deploy is
      # visible, a page that quietly lost a script is found months later by
      # somebody who will not report it.
      - name: Check the CSP still matches the pages
        run: node tools/csp-audit.js

      # The counts in README.md, in index.html's card and in this repository's
      # GitHub description are all copies of one answer js/terminal.js owns. The
      # description is the interesting one: it is the first sentence a visitor
      # reads, and it is the only copy that no commit touches, so no diff and no
      # review was ever going to catch it drifting. It advertised "40+ commands"
      # against a table of 51 — true, and useless, because a floor claim cannot
      # look stale.
      #
      # Runs here rather than in a separate workflow because a wrong number is not
      # worth blocking a deploy over twice: this job is the only thing that runs on
      # a push, and a publish that ships a false claim is the failure to prevent.
      - name: Check the documented command counts
        env:
          # Not for access — the description is public — but for the rate limit,
          # and because anonymous reads come off a CDN cache that can lag a
          # description edit by a minute. Scoped by the permissions block above.
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/check-commands.js

      # --offline, deliberately: the half of the link checker that is a function of
      # the bytes in this checkout. Local hrefs pointing at no file, in-page anchors
      # matching no id, a target="_blank" without rel="noopener", and any surviving
      # reference to the deleted my_projects monorepo — all deterministic, all
      # caused by the commit being deployed, so all of them belong on the deploy
      # path. Those four went unchecked entirely until now: the tool existed and
      # nothing ran it, which is the same as not having it, except that the profile
      # README had started describing it.
      #
      # The network half is NOT here, and that is the tool's own argument rather
      # than a concession. Link rot is time-based: a repo deleted last Tuesday is
      # not a fact about today's diff, and putting the network on the deploy path
      # means a Credly rate-limit or a LinkedIn 999 can block publishing a typo
      # fix. A gate that fails for reasons unrelated to the change is a gate people
      # learn to skip. It runs weekly instead — see link-rot.yml.
      - name: Check every local link, anchor and rel=noopener
        run: node tools/link-check.js --offline

      # Static site — no build step. Upload the repo root as-is.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
